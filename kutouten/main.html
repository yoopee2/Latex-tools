<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<title>文章整理-LaTeX-</title>
	<script src="scripts.js"></script>
	<link rel="stylesheet" href="style.css">


</head>

<body>
<h1>レポートの表記修正ツール</h1><br/>
<a>「、」や「。」などのレポート等で一般的に使用されない表記を正しい表記に変換します</a>

<details>
	<summary>使い方</summary>
	<h3>使い方</h3>
	<ol>
		<li>下の「テキストを貼り付け」の下の欄に変換したいテキストを入力する<br/>もしくは.texファイルをアップロードする</li>
		<li>修正したい部分にチェックを入れる</li>
		<li>下の青いボタン「表記を修正」を押す</li>
	</ol>
	<p>※文字数制限は基本的にありませんが、計算量がO(N)なので注意してください。</p>
</details>

<div class="section">
	<h3>テキストを貼りつけ</h3>
	<textarea id="text"></textarea>
	<h3>.texまたは.txt形式のファイルをアップロード</h3>
	<input type="file" id="file" accept=".tex, .txt"/>

<div class="check_list">
<h3>修正する部分</h3>
<label><input type="checkbox" id="kutouten" checked>「、」と「。」</label><br/>
<label><input type="checkbox" id="space" checked>全角スペース</label><br/>
<label><input type="checkbox" id="zenkaku" checked>全角文字</label>
</div>

<button id="exe" class="main_btn" onClick="exe()">表記を修正</button>

<div class="section">
	<h3>修正後テキスト</h3>
	<textarea id="output"></textarea>
	
</div>

</body>
</html>
