<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV to LaTeX Tabular Converter</title>
    <link rel="stylesheet" href="design.css">
</head>
<body>

    <h1>CSV to LaTeX Tabular 変換ツール</h1>
    <p>csvファイル、カンマと改行で区切られた表の表記をLaTeXのtabular環境の表記に変換します。</p>

    <div class="section">
        <h3>CSVファイルをアップロード</h3>
        <input type="file" id="csvFile" accept=".csv">
    </div>

    <div class="section">
        <h3>CSVテキストを直接貼り付け</h3>
        <textarea id="csvText" ></textarea>
    </div>

    <button id="convertBtn" class="btn-main">LaTeXに変換</button>

    <div class="section">
        <h3>変換結果 (LaTeX コード)</h3>
        <pre><code id="output"></code></pre>
        <button id="copyBtn" class="btn-sub">コピー</button>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
